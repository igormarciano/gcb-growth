<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GCB</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --olive-950:#25230F; --olive-900:#312F14;
    --khaki:#A29C62; --khaki-dim:#6B6748;
    --green:#88BC6C;
    --cream:#F7F5EE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--olive-950);color:var(--cream);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .logo{height:26px;width:auto;margin-bottom:40px}
  .wrap{text-align:center;max-width:420px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--green);margin-bottom:14px}
  h1{font-size:clamp(26px,5vw,34px);font-weight:900;letter-spacing:-.02em;line-height:1.15;color:#F7F5EE}
  p{margin-top:14px;font-size:15px;line-height:1.6;color:var(--khaki)}

  #gcbGate{position:fixed;inset:0;z-index:9999;background:var(--olive-950);display:flex;align-items:center;justify-content:center;padding:20px}
  #gcbGateForm{background:var(--olive-900);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:32px 28px;max-width:340px;width:100%;text-align:center}
  #gcbGateForm .eyebrow{margin-bottom:10px}
  #gcbGateForm p{color:#EDEAD9;margin:0 0 18px}
  #gcbGatePass{width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.05);color:#F7F5EE;border-radius:9999px;font-size:14px;margin-bottom:12px;text-align:center}
  #gcbGatePass::placeholder{color:var(--khaki-dim)}
  #gcbGateError{display:none;color:#E0A05B;font-size:12.5px;margin-bottom:12px}
  #gcbGateForm button{width:100%;padding:12px 14px;border:none;border-radius:9999px;background:var(--green);
    color:var(--olive-950);font-weight:700;font-size:14px;cursor:pointer}
</style>
</head>
<body>

<div id="gcbGate">
  <form id="gcbGateForm">
    <span class="eyebrow">Acesso restrito</span>
    <p>Digite a senha para continuar.</p>
    <input id="gcbGatePass" type="password" placeholder="Senha" autocomplete="off">
    <div id="gcbGateError">Senha incorreta.</div>
    <button type="submit">Entrar</button>
  </form>
</div>
<script>
(function(){
  var PASS = 'Gcb*2026';
  var gate = document.getElementById('gcbGate');
  function getAuthed(){ try { return sessionStorage.getItem('gcbAuthed') === '1'; } catch(e){ return false; } }
  function setAuthed(){ try { sessionStorage.setItem('gcbAuthed', '1'); } catch(e){} }
  if (getAuthed()) { gate.remove(); return; }
  document.documentElement.style.overflow = 'hidden';
  var form = document.getElementById('gcbGateForm');
  var input = document.getElementById('gcbGatePass');
  var err = document.getElementById('gcbGateError');
  form.addEventListener('submit', function(e){
    e.preventDefault();
    if (input.value === PASS) {
      setAuthed();
      document.documentElement.style.overflow = '';
      gate.remove();
    } else {
      err.style.display = 'block';
      input.value = '';
      input.focus();
    }
  });
  input.focus();
})();
</script>

<div class="wrap">
  <img class="logo" src="/logo-branco.png" alt="GCB Investimentos">
  <div class="eyebrow">GCB</div>
  <h1>Página em construção.</h1>
  <p>Estamos preparando algo novo por aqui. Volte em breve.</p>
</div>

</body>
</html>
